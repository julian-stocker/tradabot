[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradabot"
version = "0.1.0"
description = "Local-first stock market analysis, signal generation and backtesting platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "polars>=1.12",
    "numpy>=2.1",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
tradabot = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# Ruff: formatting + linting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "ASYNC",
    "DTZ",  # flake8-datetimez -- guards against naive datetimes
    "T20",  # no print()
    "PT",   # pytest style
    "RET",
    "ARG",  # unused arguments
    "PL",   # pylint
]
ignore = [
    "ANN401",  # allow typing.Any where genuinely needed
    "PLR0913", # many arguments is fine for config-ish constructors
    "PLR0917", # FastAPI route signatures are inherently wide (Path/Query params)
    "B008",    # FastAPI Depends()/Query() in defaults is idiomatic
    "UP046",   # PEP 695 generics are not fully supported by pydantic generics yet
]

[tool.ruff.lint.per-file-ignores]
# Local imports inside tests keep each test self-contained and readable.
"tests/**" = ["ANN", "PLR2004", "ARG001", "ARG002", "PLC0415"]
# `dialect` is part of the SQLAlchemy TypeDecorator contract, unused or not.
"app/db/types.py" = ["ARG002"]
"migrations/**" = ["ANN", "ARG", "N", "E501"]
"app/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["polars.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:asyncpg.*"]
markers = [
    "integration: tests that touch a real database",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py", "*/migrations/*"]
